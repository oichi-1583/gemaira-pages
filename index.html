<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3edda">
<title>クラスゲーム | あきと</title>
<style>
:root{color-scheme:light;--ink:#17283d;--muted:#58687a;--paper:#f3edda;--white:#fffdf6;--line:#c8c2b2;--blue:#2859d6;--red:#e5533d;--yellow:#f3c94e;--mint:#b9d7c6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:var(--paper);background-image:radial-gradient(#17283d1c .7px,transparent .7px);background-size:12px 12px;color:var(--ink);font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
a{color:inherit}
a:focus-visible{outline:3px solid var(--red);outline-offset:4px}
main{width:min(1040px,100%);margin:0 auto;padding:32px 24px 64px}
.topline{display:flex;justify-content:space-between;align-items:center;padding-bottom:15px;border-bottom:1px solid var(--ink)}
.wordmark{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.signature{font-size:12px;font-weight:800;color:var(--muted)}
.hero{display:grid;grid-template-columns:1fr 132px;align-items:center;gap:26px;padding:42px 0 34px;border-bottom:1px solid var(--ink)}
.eyebrow{margin:0 0 10px;color:var(--blue);font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
h1{max-width:760px;margin:0;font-size:58px;line-height:1.04;font-weight:950}
.hero-note{margin:16px 0 0;color:var(--muted);font-size:16px;line-height:1.6}
.stamp{width:120px;height:120px;display:grid;place-items:center;border:3px solid var(--red);border-radius:50%;color:var(--red);font-size:50px;font-weight:950;transform:rotate(8deg)}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding-top:26px}
.game{min-height:260px;display:flex;flex-direction:column;align-items:flex-start;padding:21px 22px 19px;border:1px solid var(--ink);background:var(--white);text-decoration:none;box-shadow:5px 5px 0 var(--ink);transition:transform .16s ease,box-shadow .16s ease}
.game:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.game-chair{border-top:7px solid var(--yellow)}
.game-guess{border-top:7px solid var(--blue)}
.game-number{color:var(--red);font-size:12px;font-weight:950;letter-spacing:1px}
.game h2{margin:14px 0 9px;font-size:26px;line-height:1.25;font-weight:950}
.game p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}
.game-open{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:auto;padding-top:20px;font-size:14px;font-weight:900}
.game-open span:last-child{font-size:22px;color:var(--blue)}
.footer{margin-top:27px;padding-top:14px;border-top:1px solid var(--ink);color:var(--muted);font-size:12px}
@media(max-width:680px){main{padding:21px 16px 40px}.hero{grid-template-columns:1fr 66px;gap:10px;padding:30px 0 25px}h1{font-size:42px}.hero-note{font-size:14px}.stamp{width:60px;height:60px;border-width:2px;font-size:26px}.games{grid-template-columns:1fr;gap:14px;padding-top:20px}.game{min-height:220px;padding:18px}.game h2{font-size:24px}}
@media(prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>
<main>
  <div class="topline">
    <div class="wordmark">CLASSROOM / PLAY</div>
    <div class="signature">by あきと</div>
  </div>
  <header class="hero">
    <div>
      <p class="eyebrow">Pick a game</p>
      <h1>クラスゲーム</h1>
      <p class="hero-note">みんなで遊ぶゲームを選んでください。</p>
    </div>
    <div class="stamp" aria-hidden="true">遊</div>
  </header>
  <nav class="games" aria-label="ゲーム一覧">
    <a class="game game-chair" href="./chair-game.html">
      <span class="game-number">GAME 01</span>
      <h2>イス取りゲーム、<br>ゲームマスター要らず。</h2>
      <p>YouTubeの好きな位置から流して、ランダムなタイミングでストップ。</p>
      <span class="game-open"><span>ゲームを開く</span><span aria-hidden="true">→</span></span>
    </a>
    <a class="game game-guess" href="./who-am-i.html">
      <span class="game-number">GAME 02</span>
      <h2>私は、私たちは　誰でしょう？</h2>
      <p>クラスの回答CSVを読み込み、ヒントから誰かを当てよう。</p>
      <span class="game-open"><span>ゲームを開く</span><span aria-hidden="true">→</span></span>
    </a>
  </nav>
  <footer class="footer">クラスで遊ぶためのゲーム</footer>
</main>
</body>
</html>
