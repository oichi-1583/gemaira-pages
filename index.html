<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f2e9">
<title>椅子取りゲーム、ゲームマスター要らず。byあきと</title>
<style>
:root{color-scheme:light;--ink:#20352f;--muted:#66766d;--paper:#f5f2e9;--line:#cbd4c8;--green:#28634d;--coral:#d5684a;--white:#fffefa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 8%,#e0ead8 0,transparent 34%),radial-gradient(ellipse at 90% 92%,#f0d7c7 0,transparent 33%),var(--paper);color:var(--ink);font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
main{width:min(920px,100%);margin:0 auto;padding:32px 22px 56px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding:10px 0 22px}
.eyebrow{margin:0 0 8px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1{margin:0;font-family:Georgia,"Yu Mincho",serif;font-size:clamp(30px,5vw,46px);font-weight:500;line-height:1.15}
.mark{width:50px;height:50px;flex:none;border:1px solid var(--green);border-radius:50%;display:grid;place-items:center;color:var(--green);font-size:23px}
.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.8fr);gap:24px;padding-top:26px}
.player-wrap{position:relative;aspect-ratio:16/9;background:#17231f;border:1px solid #263d33;overflow:hidden}
.player-wrap:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border:0;background:#000}
.player-wrap:fullscreen::backdrop{background:#000}
#player,#player iframe{width:100%;height:100%;display:block}
.countdown-overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0008;color:#fff;font-size:72px;font-weight:800;font-variant-numeric:tabular-nums;pointer-events:none}
.countdown-overlay[hidden]{display:none}
.audio-button{position:absolute;right:16px;bottom:16px;z-index:2;background:var(--white);color:var(--ink)}
.audio-button[hidden]{display:none}
.controls{border-top:3px solid var(--green);padding-top:17px}
label{display:block;margin:0 0 8px;font-size:13px;font-weight:700}
input{width:100%;height:44px;border:1px solid #aebcb1;border-radius:3px;padding:0 12px;background:var(--white);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:3px solid #d88a68;outline-offset:2px}
.field{margin-bottom:20px}
.buttons{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:24px}
button{height:46px;border:1px solid var(--green);border-radius:3px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer}
.primary{background:var(--green);color:white}.secondary{background:transparent;color:var(--green)}
button:disabled{opacity:.48;cursor:not-allowed}
.status{min-height:105px;margin-top:24px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.status-label{margin:0 0 4px;color:var(--muted);font-size:12px;font-weight:700}
#status{margin:0;font-family:Georgia,"Yu Mincho",serif;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.2}
#detail{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.error{color:#a63d2b}
@media(max-width:680px){main{padding:22px 16px 38px}.layout{grid-template-columns:1fr;gap:26px}.controls{padding-top:15px}header{align-items:center}}
</style>
</head>
<body>
<main>
  <header>
    <div><p class="eyebrow">A small window for video</p><h1>椅子取りゲーム、<br>ゲームマスター要らず。<br>byあきと</h1></div>
    <div class="mark" aria-hidden="true">▶</div>
  </header>
  <div class="layout">
    <section aria-label="YouTube動画">
      <div id="playerStage" class="player-wrap">
        <div id="player"></div>
        <div id="countdownOverlay" class="countdown-overlay" aria-live="assertive" hidden></div>
        <button id="audioButton" class="audio-button" type="button" hidden>音声をオン</button>
      </div>
    </section>
    <section class="controls" aria-label="再生設定">
      <div class="field">
        <label for="videoUrl">YouTube動画のURL</label>
        <input id="videoUrl" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="url">
      </div>
      <div class="field">
        <label for="startPosition">再生開始位置（秒）</label>
        <input id="startPosition" type="number" min="0" step="1" value="0" inputmode="numeric">
      </div>
      <div class="buttons">
        <button id="startButton" class="primary" type="button">5秒後に再生</button>
        <button id="resetButton" class="secondary" type="button" disabled>リセット</button>
      </div>
      <div class="status" role="status" aria-live="polite">
        <p class="status-label">再生タイマー</p>
        <p id="status">待機中</p>
        <p id="detail">動画URLを入力してください。</p>
      </div>
    </section>
  </div>
</main>
<script>
let player=null;
let playerReady=false;
let countdownTimer=null;
let stopTimer=null;
let playbackAttemptTimer=null;
let remaining=5;
let state="idle";
let pendingVideoId="";
let selectedDuration=0;
let selectedStartPosition=0;
let resumeOnNextPlay=false;
let resumeCurrentPlayback=false;
let mutedAutoplayRetry=false;
let audioRestoreTimer=null;
let playbackStatusDetail="";

const videoUrl=document.querySelector("#videoUrl");
const startPosition=document.querySelector("#startPosition");
const playerStage=document.querySelector("#playerStage");
const countdownOverlay=document.querySelector("#countdownOverlay");
const audioButton=document.querySelector("#audioButton");
const startButton=document.querySelector("#startButton");
const resetButton=document.querySelector("#resetButton");
const statusText=document.querySelector("#status");
const detailText=document.querySelector("#detail");

function parseVideoId(value){
  try{
    const url=new URL(value.trim());
    const host=url.hostname.replace(/^www\./," ").trim().toLowerCase();
    let id="";
    if(host==="youtu.be") id=url.pathname.split("/").filter(Boolean)[0]||"";
    else if(["youtube.com","m.youtube.com","music.youtube.com"].includes(host)){
      if(url.pathname==="/watch") id=url.searchParams.get("v")||"";
      else if(/^\/(embed|shorts|live)\//.test(url.pathname)) id=url.pathname.split("/")[2]||"";
    }
    return /^[\w-]{11}$/.test(id)?id:"";
  }catch{return "";}
}

function setStatus(title,detail,isError=false){
  statusText.textContent=title;
  detailText.textContent=detail;
  detailText.classList.toggle("error",isError);
}

function setBusy(busy){
  startButton.disabled=busy;
  videoUrl.disabled=busy;
  startPosition.disabled=busy;
  resetButton.disabled=!busy;
}

function enterFullscreen(){
  if(document.fullscreenElement===playerStage || !playerStage.requestFullscreen) return;
  playerStage.requestFullscreen().catch(()=>{});
}

function exitFullscreen(){
  if(document.fullscreenElement===playerStage) document.exitFullscreen().catch(()=>{});
}

function startCountdown(){
  state="countdown";
  remaining=5;
  countdownOverlay.textContent=String(remaining);
  countdownOverlay.hidden=false;
  startButton.textContent="5秒後に再生";
  setBusy(true);
  setStatus(String(remaining),"秒後に動画を再生します。");
  countdownTimer=window.setInterval(()=>{
    remaining-=1;
    if(remaining>0){
      countdownOverlay.textContent=String(remaining);
      setStatus(String(remaining),"秒後に動画を再生します。");
      return;
    }
    window.clearInterval(countdownTimer);
    countdownTimer=null;
    countdownOverlay.hidden=true;
    playForSelectedDuration();
  },1000);
}

function playForSelectedDuration(){
  if(!playerReady){
    setStatus("準備中", "YouTubeプレーヤーを読み込んでいます。");
    return;
  }
  selectedDuration=Math.floor(Math.random()*11)+5;
  requestPlayback();
}

function requestPlayback(){
  state="starting";
  mutedAutoplayRetry=false;
  const startDetail=resumeCurrentPlayback?"停止位置から":`${selectedStartPosition}秒から`;
  setStatus("再生準備中",`${startDetail}${selectedDuration}秒間再生します。`);
  const delay=player.getPlayerState()===YT.PlayerState.BUFFERING?7000:2500;
  playbackAttemptTimer=window.setTimeout(showPlaybackFallback,delay);
  player.playVideo();
}

function updateAudioStatus(isMuted){
  audioButton.hidden=!isMuted;
  const detail=isMuted?`${playbackStatusDetail} 自動再生中はミュートです。音声をオンにしてください。`:playbackStatusDetail;
  setStatus("再生中",detail);
}

function enableAudio(){
  if(!playerReady) return;
  state="starting";
  audioButton.disabled=true;
  setStatus("再生準備中","音声付きで再生します。");
  playbackAttemptTimer=window.setTimeout(showPlaybackFallback,7000);
  player.unMute();
  player.playVideo();
}

function showPlaybackFallback(){
  if(state!=="starting") return;
  playbackAttemptTimer=null;
  state="awaiting-gesture";
  countdownOverlay.hidden=true;
  audioButton.disabled=false;
  audioButton.hidden=false;
  audioButton.textContent="音声付きで再生";
  setStatus("再生の準備ができました","音声付きで再生するには、全画面のボタンを押してください。");
}

function stopPlayback(allowResume=true){
  const wasPlaying=state==="playing";
  if(playerReady) player.pauseVideo();
  clearTimers();
  countdownOverlay.hidden=true;
  audioButton.hidden=true;
  exitFullscreen();
  resumeOnNextPlay=allowResume && wasPlaying && playerReady;
  resumeCurrentPlayback=false;
  mutedAutoplayRetry=false;
  state="idle";
  setBusy(false);
  startButton.textContent="5秒後に再生";
  setStatus("停止しました",resumeOnNextPlay?"同じ動画は停止位置から再開します。":"もう一度再生するにはボタンを押してください。");
}

function clearTimers(){
  if(countdownTimer!==null) window.clearInterval(countdownTimer);
  if(stopTimer!==null) window.clearTimeout(stopTimer);
  if(playbackAttemptTimer!==null) window.clearTimeout(playbackAttemptTimer);
  if(audioRestoreTimer!==null) window.clearTimeout(audioRestoreTimer);
  countdownTimer=null;
  stopTimer=null;
  playbackAttemptTimer=null;
  audioRestoreTimer=null;
}

function reset(){
  clearTimers();
  if(playerReady) player.stopVideo();
  state="idle";
  countdownOverlay.hidden=true;
  audioButton.hidden=true;
  exitFullscreen();
  resumeOnNextPlay=false;
  resumeCurrentPlayback=false;
  mutedAutoplayRetry=false;
  setBusy(false);
  startButton.textContent="5秒後に再生";
  setStatus("待機中","動画URLを入力してください。");
}

function onYouTubeIframeAPIReady(){
  startButton.addEventListener("click",()=>{
    if(state==="awaiting-gesture"){
      enterFullscreen();
      startButton.disabled=true;
      startButton.textContent="5秒後に再生";
      player.unMute();
      requestPlayback();
      return;
    }
    const videoId=parseVideoId(videoUrl.value);
    if(!videoId){
      setStatus("URLを確認してください","YouTube動画のURLを入力してください。",true);
      videoUrl.focus();
      return;
    }
    const position=Number(startPosition.value);
    if(startPosition.value.trim()==="" || !Number.isInteger(position) || position<0){
      setStatus("再生位置を確認してください","0以上の秒数を入力してください。",true);
      startPosition.focus();
      return;
    }
    selectedStartPosition=position;
    enterFullscreen();
    if(playerReady){
      const resume=resumeOnNextPlay && pendingVideoId===videoId;
      if(!resume) player.cueVideoById({videoId,startSeconds:selectedStartPosition});
      player.unMute();
      pendingVideoId=videoId;
      resumeCurrentPlayback=resume;
      resumeOnNextPlay=false;
      startCountdown();
      return;
    }
    pendingVideoId=videoId;
    resumeCurrentPlayback=false;
    state="loading";
    setBusy(true);
    setStatus("準備中","動画を読み込んでいます。");
    player=new YT.Player("player",{
      width:"100%",
      height:"100%",
      videoId:pendingVideoId,
      playerVars:{playsinline:1,rel:0},
      events:{
        onReady:event=>{
          playerReady=true;
          event.target.cueVideoById({videoId:pendingVideoId,startSeconds:selectedStartPosition});
          startCountdown();
        },
        onError:()=>{
          clearTimers();
          state="idle";
          mutedAutoplayRetry=false;
          countdownOverlay.hidden=true;
          audioButton.hidden=true;
          exitFullscreen();
          setBusy(false);
          startButton.textContent="5秒後に再生";
          setStatus("動画を再生できません","URL、公開設定、または埋め込み許可を確認してください。",true);
        },
        onStateChange:event=>{
          if(event.data===YT.PlayerState.BUFFERING && state==="starting"){
            if(playbackAttemptTimer!==null) window.clearTimeout(playbackAttemptTimer);
            playbackAttemptTimer=window.setTimeout(showPlaybackFallback,7000);
          }
          if(event.data===YT.PlayerState.PLAYING && state==="starting"){
            if(playbackAttemptTimer!==null) window.clearTimeout(playbackAttemptTimer);
            playbackAttemptTimer=null;
            const resumed=resumeCurrentPlayback;
            resumeCurrentPlayback=false;
            mutedAutoplayRetry=false;
            state="playing";
            const startDetail=resumed?"停止位置から再生中":`${selectedStartPosition}秒から再生中`;
            playbackStatusDetail=`${startDetail}。${selectedDuration}秒後に自動停止します。`;
            audioButton.textContent="音声をオン";
            audioButton.disabled=false;
            audioButton.hidden=true;
            setStatus("再生中",playbackStatusDetail);
            stopTimer=window.setTimeout(stopPlayback,selectedDuration*1000);
          }
          if(event.data===YT.PlayerState.ENDED && state==="playing") stopPlayback(false);
        },
        onAutoplayBlocked:showPlaybackFallback
      }
    });
  });
}

resetButton.addEventListener("click",reset);
audioButton.addEventListener("click",enableAudio);
window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;
const apiScript=document.createElement("script");
apiScript.src="https://www.youtube.com/iframe_api";
document.head.appendChild(apiScript);
if(location.protocol==="file:"){
  startButton.disabled=true;
  setStatus("HTTPで開いてください","YouTubeはHTMLファイルを直接開くと再生できません。open-youtube-timer.batから起動してください。",true);
}
</script>
</body>
</html>
